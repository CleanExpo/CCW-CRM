# Docker Compose Configuration for Production Environment
# CCW-Online ERP - Production Deployment
#
# Features:
# - PostgreSQL database (persistent volume)
# - Redis cache (persistent volume)
# - Backend API (FastAPI)
# - Frontend web (Next.js)
# - Nginx reverse proxy (SSL termination)
# - Resource limits (production specs)
# - Health checks
# - Restart policies
# - Security hardening
#
# Usage:
#   docker compose -f docker-compose.production.yml up -d
#   docker compose -f docker-compose.production.yml logs -f
#   docker compose -f docker-compose.production.yml down

version: '3.9'

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: ccw-erp-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-starter_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-starter_db}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - '127.0.0.1:5432:5432' # Only accessible from localhost
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-starter_user} -d ${POSTGRES_DB:-starter_db}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ccw-internal
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '10'

  # ===========================================================================
  # Redis Cache
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: ccw-erp-redis-prod
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - '127.0.0.1:6379:6379' # Only accessible from localhost
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - ccw-internal
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'

  # ===========================================================================
  # Backend API (FastAPI)
  # ===========================================================================
  backend:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${IMAGE_NAME:-ccw-erp}/backend:${VERSION:-latest}
    container_name: ccw-erp-backend-prod
    restart: unless-stopped
    environment:
      # Environment
      ENVIRONMENT: production
      DEBUG: 'false'
      LOG_LEVEL: INFO

      # Database
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-starter_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-starter_db}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: 0
      CACHE_ENABLED: 'true'

      # JWT
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 30

      # CORS
      CORS_ORIGINS: '["https://ccw-erp.com", "https://www.ccw-erp.com"]'

      # Stripe
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}

      # SendGrid
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}

      # Sentry
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-ccw-erp@1.0.0}
      SENTRY_TRACES_SAMPLE_RATE: 0.1
      SENTRY_PROFILES_SAMPLE_RATE: 0.1

      # Monitoring
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}

      # Feature Flags
      FEATURE_ANALYTICS_ENABLED: 'true'
      FEATURE_AI_ENABLED: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:8000:8000' # Only accessible from localhost (nginx proxies)
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ccw-internal
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '10'

  # ===========================================================================
  # Frontend Web (Next.js)
  # ===========================================================================
  web:
    image: ${DOCKER_REGISTRY:-ghcr.io}/${IMAGE_NAME:-ccw-erp}/web:${VERSION:-latest}
    container_name: ccw-erp-web-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BACKEND_URL: https://api.ccw-erp.com
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
      NEXT_PUBLIC_ENVIRONMENT: production
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000' # Only accessible from localhost (nginx proxies)
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ccw-internal
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '10'

  # ===========================================================================
  # Nginx Reverse Proxy
  # ===========================================================================
  nginx:
    image: nginx:1.24-alpine
    container_name: ccw-erp-nginx-prod
    restart: unless-stopped
    volumes:
      - ./deployment/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'nginx', '-t']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ccw-internal
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '10'

networks:
  ccw-internal:
    name: ccw-production-network
    driver: bridge
    internal: false

volumes:
  postgres_data:
    name: ccw-postgres-production-data
    driver: local
  redis_data:
    name: ccw-redis-production-data
    driver: local
  nginx_logs:
    name: ccw-nginx-production-logs
    driver: local
