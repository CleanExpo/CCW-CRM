name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  NODE_VERSION: '20'

jobs:
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    outputs:
      tests_passed: ${{ steps.test.outcome == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run unit tests with coverage
        id: test
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 30

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [frontend-tests]
    outputs:
      build_passed: ${{ steps.build.outcome == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        id: build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  post-preview-comment:
    name: Post Preview URL
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Comment preview URL on PR
        uses: actions/github-script@v8
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const branch = context.payload.pull_request.head.ref
              .replace(/[^a-zA-Z0-9-]/g, '-')
              .toLowerCase()
              .slice(0, 63);

            const body = [
              '## Deployment Preview',
              '',
              `**Branch:** \`${context.payload.pull_request.head.ref}\``,
              `**Commit:** \`${sha}\``,
              '',
              '| Environment | URL | Status |',
              '|-------------|-----|--------|',
              `| Vercel Preview | [ccw-erp-git-${branch}.vercel.app](https://ccw-erp-git-${branch}.vercel.app) | Auto-built by Vercel |`,
              '',
              '_Production requires manual approval after staging passes._',
            ].join('\n');

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('## Deployment Preview')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [frontend-tests, build]
    if: always()

    steps:
      - name: Check CI results
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.frontend-tests.result }}" == "success" ]; then
            echo "- :white_check_mark: Frontend Tests: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :x: Frontend Tests: ${{ needs.frontend-tests.result }}" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "- :white_check_mark: Build: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :x: Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if any job failed
        if: |
          needs.frontend-tests.result == 'failure' ||
          needs.build.result == 'failure'
        run: |
          echo "One or more critical jobs failed"
          exit 1
