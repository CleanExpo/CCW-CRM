name: CI

on:
  push:
    branches: [main, ai-updates]
  pull_request:
    branches: [main, ai-updates]

permissions:
  contents: read
  pull-requests: write

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.15.0'
  PYTHON_VERSION: '3.12'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # Backend Tests
  # ============================================================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    outputs:
      tests_passed: ${{ steps.test.outcome == 'success' }}

    services:
      postgres:
        # pgvector/pgvector:pg15 includes the pgvector extension required by migration 002
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: starter_db
          POSTGRES_USER: starter_user
          POSTGRES_PASSWORD: local_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 'latest'

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            apps/backend/.venv
          key: ${{ runner.os }}-uv-${{ hashFiles('apps/backend/pyproject.toml', 'apps/backend/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        working-directory: apps/backend
        run: uv sync --all-extras

      - name: Lint with ruff
        working-directory: apps/backend
        run: uv run ruff check src/

      - name: Type check with mypy
        working-directory: apps/backend
        run: uv run mypy src/ --ignore-missing-imports

      - name: Run database migrations
        working-directory: apps/backend
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql://starter_user:local_dev_password@localhost:5432/starter_db

      - name: Seed demo data
        run: |
          PGPASSWORD=local_dev_password psql \
            -h localhost -U starter_user -d starter_db \
            -f apps/backend/seed_demo_simple.sql

      - name: Run tests with coverage
        id: test
        working-directory: apps/backend
        run: uv run pytest --cov=src --cov-report=xml --cov-report=html --cov-report=term-missing --cov-fail-under=43 -v
        env:
          DATABASE_URL: postgresql://starter_user:local_dev_password@localhost:5432/starter_db
          REDIS_URL: redis://localhost:6379/0
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            apps/backend/coverage.xml
            apps/backend/htmlcov/
          retention-days: 30

  # ============================================================================
  # Frontend Tests
  # ============================================================================
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    outputs:
      tests_passed: ${{ steps.test.outcome == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Type check
        run: pnpm turbo run type-check

      - name: Run unit tests with coverage
        id: test
        run: pnpm turbo run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: apps/web/coverage/
          retention-days: 30

  # ============================================================================
  # Build Check
  # ============================================================================
  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    outputs:
      build_passed: ${{ steps.build.outcome == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        id: build
        run: pnpm turbo run build
        env:
          NEXT_PUBLIC_BACKEND_URL: http://localhost:8000

  # ============================================================================
  # PR Preview Comment
  # ============================================================================
  post-preview-comment:
    name: Post Preview URL
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const branch = context.payload.pull_request.head.ref
              .replace(/[^a-zA-Z0-9-]/g, '-')
              .toLowerCase()
              .slice(0, 63);

            const body = [
              '## Deployment Preview',
              '',
              `**Branch:** \`${context.payload.pull_request.head.ref}\``,
              `**Commit:** \`${sha}\``,
              '',
              '| Environment | URL | Status |',
              '|-------------|-----|--------|',
              `| Vercel Preview | [ccw-erp-git-${branch}.vercel.app](https://ccw-erp-git-${branch}.vercel.app) | Auto-built by Vercel |`,
              `| Staging API | [api.staging.ccw-erp.com/api/health](https://api.staging.ccw-erp.com/api/health) | Deployed on merge to \`main\` |`,
              '',
              '_Production requires manual approval after staging passes._',
            ].join('\n');

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('## Deployment Preview')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  # ============================================================================
  # Docker Build (for deployment readiness)
  # ============================================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e4db8464a088ece1b920f60402e813ea4de65b8f # v3

      - name: Build backend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: false
          tags: ccw-erp-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: false
          tags: ccw-erp-web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # E2E Tests
  # ============================================================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: starter_db
          POSTGRES_USER: starter_user
          POSTGRES_PASSWORD: local_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          version: 'latest'

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install backend dependencies
        working-directory: apps/backend
        run: uv sync --all-extras

      - name: Run database migrations
        working-directory: apps/backend
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql://starter_user:local_dev_password@localhost:5432/starter_db
          JWT_SECRET_KEY: ci-test-secret-key-minimum-32-chars

      - name: Seed demo data
        run: |
          PGPASSWORD=local_dev_password psql \
            -h localhost -U starter_user -d starter_db \
            -f apps/backend/seed_demo_simple.sql

      - name: Start backend server
        working-directory: apps/backend
        run: |
          nohup uv run uvicorn src.api.main:app \
            --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          echo "Backend PID: $!"
          for i in {1..30}; do
            if curl -sf http://localhost:8000/api/health > /dev/null 2>&1; then
              echo "Backend is ready after ${i}s"
              break
            fi
            echo "Waiting for backend... attempt $i/30"
            sleep 2
          done
        env:
          DATABASE_URL: postgresql://starter_user:local_dev_password@localhost:5432/starter_db
          REDIS_URL: redis://localhost:6379/0
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          JWT_SECRET_KEY: ci-test-secret-key-minimum-32-chars

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: apps/web
        run: pnpm test:e2e
        env:
          CI: true
          NEXT_PUBLIC_BACKEND_URL: http://localhost:8000

      - name: Show backend logs on failure
        if: failure()
        run: cat /tmp/backend.log || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: apps/web/test-results/

  # ============================================================================
  # Accessibility Tests
  # ============================================================================
  accessibility-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    needs: [frontend-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run accessibility tests
        working-directory: apps/web
        run: pnpm exec playwright test --config=playwright.a11y.config.ts
        env:
          CI: true

      - name: Upload accessibility test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-test-results
          path: apps/web/test-results/
          retention-days: 30

      - name: Upload Playwright report (accessibility)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-playwright-report
          path: apps/web/playwright-report/
          retention-days: 30

  # ============================================================================
  # CI Summary
  # ============================================================================
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, build, e2e-tests, accessibility-tests]
    if: always()

    steps:
      - name: Check CI results
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.backend-tests.result }}" == "success" ]; then
            echo "- :white_check_mark: Backend Tests: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :x: Backend Tests: ${{ needs.backend-tests.result }}" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.frontend-tests.result }}" == "success" ]; then
            echo "- :white_check_mark: Frontend Tests: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :x: Frontend Tests: ${{ needs.frontend-tests.result }}" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "- :white_check_mark: Build: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :x: Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.e2e-tests.result }}" == "success" ]; then
            echo "- :white_check_mark: E2E Tests: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :x: E2E Tests: ${{ needs.e2e-tests.result }}" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.accessibility-tests.result }}" == "success" ]; then
            echo "- :white_check_mark: Accessibility Tests: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :x: Accessibility Tests: ${{ needs.accessibility-tests.result }}" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if any job failed
        if: |
          needs.backend-tests.result == 'failure' ||
          needs.frontend-tests.result == 'failure' ||
          needs.build.result == 'failure'
        run: |
          echo "One or more critical jobs failed"
          exit 1
