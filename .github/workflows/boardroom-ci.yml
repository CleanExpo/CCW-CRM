name: CCW Boardroom CI

on:
  push:
    branches: [main, develop, fix/railway-cache-auth-500]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test

  validate:
    name: Validation Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate hooks structure
        run: node scripts/ci/validate-hooks.js
      - name: Validate agent YAML frontmatter
        run: node scripts/ci/validate-agents.js
      - name: Validate CRON job registrations
        run: node scripts/ci/validate-cron-jobs.js
      - name: Validate vercel.json crons resolve to live handlers
        run: |
          node scripts/ci/validate-vercel-crons.js
          node scripts/ci/validate-vercel-crons.js --self-test
      - name: Validate every stylesheet is reachable
        run: |
          node scripts/ci/validate-css-sources.js
          node scripts/ci/validate-css-sources.js --self-test
      - name: Validate Deepsec workflow contract
        run: |
          node scripts/ci/validate-deepsec-workflow.js
          node scripts/ci/validate-deepsec-workflow.js --self-test

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high || true
      - name: Scan for hardcoded secrets
        run: node scripts/ci/scan-secrets.js

  # The browser suite was written but never wired into CI, so nothing would have
  # surfaced an accessibility regression or a stale visual baseline until a human
  # happened to run it locally. This runs the PUBLIC specs — the authenticated
  # ones need credentials and a working production database, neither of which
  # exists yet (see docs/RESTORE-PRODUCTION-DATABASE.md).
  #
  # Reporting-only for now, deliberately and visibly: the six committed baselines
  # were captured from production before the 2026-08-07 contrast fix, so the first
  # run after that deploys WILL diff. Making this blocking before those baselines
  # are regenerated would produce a red gate everyone routes around. Flip
  # continue-on-error off once `--update-snapshots` has been run against a
  # production build that includes the fix.
  e2e-public:
    name: Browser Suite (public routes, reporting-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run public browser specs
        run: npx playwright test e2e/public-surface.spec.ts
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy Gate
    needs: [test, validate, security]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy gate passed
        run: echo "All gates passed. Vercel auto-deploy triggered on push to main."
