name: CCW Boardroom CI

on:
  push:
    branches: [main, develop, fix/railway-cache-auth-500]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test

  validate:
    name: Validation Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate hooks structure
        run: node scripts/ci/validate-hooks.js
      - name: Validate agent YAML frontmatter
        run: node scripts/ci/validate-agents.js
      - name: Validate CRON job registrations
        run: node scripts/ci/validate-cron-jobs.js
      - name: Validate vercel.json crons resolve to live handlers
        run: |
          node scripts/ci/validate-vercel-crons.js
          node scripts/ci/validate-vercel-crons.js --self-test
      - name: Validate Deepsec workflow contract
        run: |
          node scripts/ci/validate-deepsec-workflow.js
          node scripts/ci/validate-deepsec-workflow.js --self-test

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high || true
      - name: Scan for hardcoded secrets
        run: node scripts/ci/scan-secrets.js

  deploy:
    name: Deploy Gate
    needs: [test, validate, security]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy gate passed
        run: echo "All gates passed. Vercel auto-deploy triggered on push to main."
