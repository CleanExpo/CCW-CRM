name: Deepsec weekly security scan
on:
  schedule:
    - cron: '0 13 * * 1'   # 23:00 UTC Monday = 09:00 AEST Tuesday
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  deepsec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          cd .deepsec
          npm install
      - name: Run Deepsec
        run: |
          cd .deepsec
          result_root="$PWD/data/CCW-CRM"
          result_dir="$result_root/runs"
          rm -rf "$result_root"
          trap 'rm -rf "$result_root"' EXIT
          scan_started_at=$(date +%s)
          npx deepsec scan --project-id CCW-CRM
          node ../scripts/ci/validate-deepsec-workflow.js --receipt "$result_dir" --started-at "$scan_started_at"
      - name: Open issue on scan failure
        if: failure()
        run: |
          # Ensure labels exist
          gh label create "security" --color "d73a4a" --description "Security related" 2>/dev/null || true
          gh label create "deepsec" --color "7057ff" --description "Deepsec scan" 2>/dev/null || true
          gh label create "weekly-scan" --color "008672" --description "Weekly automated scan" 2>/dev/null || true
          gh issue create \
            --title "[deepsec] Weekly scan failed $(date +%Y-%m-%d)" \
            --label "security,deepsec,weekly-scan" \
            --body "The weekly Deepsec scan failed to complete or produce a valid receipt. See the exact run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
