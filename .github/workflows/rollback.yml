name: Emergency Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to rollback'
        required: true
        type: choice
        options:
          - staging
          - production
      rollback_type:
        description: 'Type of rollback'
        required: true
        type: choice
        options:
          - code_only
          - code_and_database
          - database_only
      version:
        description: 'Git tag or commit SHA to rollback to (leave empty for previous version)'
        required: false
        default: ''
      backup_file:
        description: 'Database backup filename to restore (for database rollback)'
        required: false
        default: ''
      confirm_rollback:
        description: 'Type ROLLBACK to confirm'
        required: true

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.event.inputs.environment }}-rollback
  cancel-in-progress: false

jobs:
  # ============================================================================
  # Validate Rollback Request
  # ============================================================================
  validate:
    name: Validate Rollback Request
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ github.event.inputs.environment }}
      rollback_type: ${{ github.event.inputs.rollback_type }}
      version: ${{ steps.version.outputs.version }}
      short_sha: ${{ steps.version.outputs.short_sha }}
      backup_file: ${{ github.event.inputs.backup_file }}

    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_rollback }}" != "ROLLBACK" ]; then
            echo "Error: You must type ROLLBACK to confirm the rollback operation"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine rollback version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Get version from 2 commits back (current and previous)
            VERSION=$(git rev-parse HEAD~1)
          fi

          if ! git rev-parse "$VERSION" > /dev/null 2>&1; then
            echo "Error: Version $VERSION does not exist"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=$(git rev-parse --short $VERSION)" >> $GITHUB_OUTPUT

      - name: Validate database backup (if needed)
        if: github.event.inputs.rollback_type == 'code_and_database' || github.event.inputs.rollback_type == 'database_only'
        run: |
          if [ -z "${{ github.event.inputs.backup_file }}" ]; then
            echo "Warning: No backup file specified. Will use most recent backup."
          fi

  # ============================================================================
  # Execute Rollback
  # ============================================================================
  rollback:
    name: Execute Rollback
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: ${{ needs.validate.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.version }}

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ needs.validate.outputs.environment == 'production' && secrets.PRODUCTION_SSH_KEY || secrets.STAGING_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          if [ "${{ needs.validate.outputs.environment }}" == "production" ]; then
            ssh-keyscan -H ${{ secrets.PRODUCTION_SSH_HOST }} >> ~/.ssh/known_hosts
          else
            ssh-keyscan -H ${{ secrets.STAGING_SSH_HOST }} >> ~/.ssh/known_hosts
          fi

      - name: Set server variables
        id: server
        run: |
          if [ "${{ needs.validate.outputs.environment }}" == "production" ]; then
            echo "host=${{ secrets.PRODUCTION_SSH_HOST }}" >> $GITHUB_OUTPUT
            echo "user=${{ secrets.PRODUCTION_SSH_USER }}" >> $GITHUB_OUTPUT
            echo "compose_file=docker-compose.production.yml" >> $GITHUB_OUTPUT
            echo "db_name=starter_db" >> $GITHUB_OUTPUT
          else
            echo "host=${{ secrets.STAGING_SSH_HOST }}" >> $GITHUB_OUTPUT
            echo "user=${{ secrets.STAGING_SSH_USER }}" >> $GITHUB_OUTPUT
            echo "compose_file=docker-compose.staging.yml" >> $GITHUB_OUTPUT
            echo "db_name=starter_db_staging" >> $GITHUB_OUTPUT
          fi

      - name: Create emergency backup
        id: emergency-backup
        run: |
          BACKUP_NAME=$(ssh ${{ steps.server.outputs.user }}@${{ steps.server.outputs.host }} << EOF
            set -e
            BACKUP_DIR="/var/backups/ccw-erp"
            BACKUP_FILE="emergency_$(date +%Y%m%d_%H%M%S).sql"
            mkdir -p \$BACKUP_DIR

            cd /opt/ccw-erp
            docker compose -f ${{ steps.server.outputs.compose_file }} exec -T postgres \
              pg_dump -U starter_user ${{ steps.server.outputs.db_name }} > \$BACKUP_DIR/\$BACKUP_FILE || true

            echo \$BACKUP_FILE
          EOF
          )
          echo "emergency_backup=$BACKUP_NAME" >> $GITHUB_OUTPUT
          echo "Created emergency backup: $BACKUP_NAME"

      - name: Stop application services
        run: |
          ssh ${{ steps.server.outputs.user }}@${{ steps.server.outputs.host }} << 'EOF'
            set -e
            cd /opt/ccw-erp
            echo "Stopping application services..."
            docker compose -f ${{ steps.server.outputs.compose_file }} stop web backend
          EOF

      - name: Rollback code
        if: needs.validate.outputs.rollback_type == 'code_only' || needs.validate.outputs.rollback_type == 'code_and_database'
        run: |
          ssh ${{ steps.server.outputs.user }}@${{ steps.server.outputs.host }} << 'EOF'
            set -e
            cd /opt/ccw-erp

            echo "Current version: $(git rev-parse --short HEAD)"
            echo "Rolling back to: ${{ needs.validate.outputs.short_sha }}"

            # Fetch and checkout target version
            git fetch --all
            git checkout ${{ needs.validate.outputs.version }}
            git reset --hard ${{ needs.validate.outputs.version }}

            # Rebuild images
            docker compose -f ${{ steps.server.outputs.compose_file }} build --no-cache

            echo "Code rollback completed"
          EOF

      - name: Rollback database
        if: needs.validate.outputs.rollback_type == 'code_and_database' || needs.validate.outputs.rollback_type == 'database_only'
        run: |
          ssh ${{ steps.server.outputs.user }}@${{ steps.server.outputs.host }} << 'EOF'
            set -e
            cd /opt/ccw-erp
            BACKUP_DIR="/var/backups/ccw-erp"

            # Determine which backup to restore
            if [ -n "${{ needs.validate.outputs.backup_file }}" ]; then
              RESTORE_FILE="${{ needs.validate.outputs.backup_file }}"
            else
              # Find most recent backup (excluding emergency backups from this run)
              RESTORE_FILE=$(ls -t $BACKUP_DIR/pre_deploy_*.sql 2>/dev/null | head -1)
              if [ -z "$RESTORE_FILE" ]; then
                RESTORE_FILE=$(ls -t $BACKUP_DIR/*.sql 2>/dev/null | head -1)
              fi
            fi

            if [ ! -f "$BACKUP_DIR/$RESTORE_FILE" ] && [ ! -f "$RESTORE_FILE" ]; then
              echo "Error: Backup file not found: $RESTORE_FILE"
              ls -la $BACKUP_DIR/
              exit 1
            fi

            echo "Restoring database from: $RESTORE_FILE"

            # Stop and restart postgres to clear connections
            docker compose -f ${{ steps.server.outputs.compose_file }} stop postgres
            docker compose -f ${{ steps.server.outputs.compose_file }} start postgres
            sleep 10

            # Restore database
            if [ -f "$BACKUP_DIR/$RESTORE_FILE" ]; then
              docker compose -f ${{ steps.server.outputs.compose_file }} exec -T postgres \
                psql -U starter_user -d ${{ steps.server.outputs.db_name }} < $BACKUP_DIR/$RESTORE_FILE
            else
              docker compose -f ${{ steps.server.outputs.compose_file }} exec -T postgres \
                psql -U starter_user -d ${{ steps.server.outputs.db_name }} < $RESTORE_FILE
            fi

            echo "Database rollback completed"
          EOF

      - name: Restart all services
        run: |
          ssh ${{ steps.server.outputs.user }}@${{ steps.server.outputs.host }} << 'EOF'
            set -e
            cd /opt/ccw-erp
            echo "Starting all services..."
            docker compose -f ${{ steps.server.outputs.compose_file }} up -d
          EOF

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to become healthy..."
          sleep 30

          MAX_RETRIES=12
          RETRY_COUNT=0

          if [ "${{ needs.validate.outputs.environment }}" == "production" ]; then
            HEALTH_URL="https://api.ccw-erp.com/api/health"
          else
            HEALTH_URL="https://api.staging.ccw-erp.com/api/health"
          fi

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" $HEALTH_URL || echo "000")

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Health check passed (HTTP $HTTP_STATUS)"
              exit 0
            fi

            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Health check attempt $RETRY_COUNT/$MAX_RETRIES failed (HTTP $HTTP_STATUS)"
            sleep 10
          done

          echo "Warning: Health check did not pass after $MAX_RETRIES attempts"
          exit 1

  # ============================================================================
  # Verify and Notify
  # ============================================================================
  verify:
    name: Verify Rollback
    runs-on: ubuntu-latest
    needs: [validate, rollback]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.version }}

      - name: Run quick smoke tests
        run: |
          if [ "${{ needs.validate.outputs.environment }}" == "production" ]; then
            BASE_URL="https://api.ccw-erp.com"
          else
            BASE_URL="https://api.staging.ccw-erp.com"
          fi

          # Health check
          echo "Testing health endpoint..."
          curl -f $BASE_URL/api/health

          echo "Rollback verification completed successfully!"

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [validate, rollback, verify]
    if: always()

    steps:
      - name: Set status
        id: status
        run: |
          if [ "${{ needs.rollback.result }}" == "success" ] && [ "${{ needs.verify.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "emoji=:white_check_mark:" >> $GITHUB_OUTPUT
            echo "color=warning" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "emoji=:x:" >> $GITHUB_OUTPUT
            echo "color=danger" >> $GITHUB_OUTPUT
          fi

      - name: Create rollback summary
        run: |
          echo "## Emergency Rollback Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ needs.validate.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Rollback Type:** ${{ needs.validate.outputs.rollback_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Rolled back to:** ${{ needs.validate.outputs.short_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Initiated by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ steps.status.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.rollback.result }}" == "success" ]; then
            echo "- :white_check_mark: Rollback: Successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :x: Rollback: ${{ needs.rollback.result }}" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.verify.result }}" == "success" ]; then
            echo "- :white_check_mark: Verification: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :x: Verification: ${{ needs.verify.result }}" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Send Slack notification
        if: secrets.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v3.0.1
        with:
          payload: |
            {
              "attachments": [
                {
                  "color": "${{ steps.status.outputs.color }}",
                  "blocks": [
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": ":warning: *Emergency Rollback - ${{ needs.validate.outputs.environment }}*"
                      }
                    },
                    {
                      "type": "section",
                      "fields": [
                        {
                          "type": "mrkdwn",
                          "text": "*Environment:*\n${{ needs.validate.outputs.environment }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Rollback Type:*\n${{ needs.validate.outputs.rollback_type }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Rolled back to:*\n${{ needs.validate.outputs.short_sha }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Initiated by:*\n${{ github.actor }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Status:*\n${{ steps.status.outputs.emoji }} ${{ steps.status.outputs.status }}"
                        }
                      ]
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
