name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly security scans on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.15.0'
  PYTHON_VERSION: '3.12'

jobs:
  snyk-frontend:
    name: Snyk Frontend Security Scan (Optional)
    runs-on: ubuntu-latest
    steps:
      - name: Check if Snyk token is available
        id: check-token
        run: |
          if [ -z "${{ secrets.SNYK_TOKEN }}" ]; then
            echo "SNYK_TOKEN not set, skipping Snyk scan"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        if: steps.check-token.outputs.skip != 'true'
        uses: actions/checkout@v6

      - name: Setup pnpm
        if: steps.check-token.outputs.skip != 'true'
        uses: pnpm/action-setup@6e7bdbda5fe05107efc88b23b7ed00aa05f84ca0 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        if: steps.check-token.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.check-token.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Run Snyk to check for vulnerabilities
        if: steps.check-token.outputs.skip != 'true'
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # master 2026-03-24
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=apps/web/package.json

      - name: Upload Snyk report
        if: steps.check-token.outputs.skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-frontend-report
          path: snyk-report.json
          retention-days: 30

  snyk-backend:
    name: Snyk Backend Security Scan (Optional)
    runs-on: ubuntu-latest
    steps:
      - name: Check if Snyk token is available
        id: check-token
        run: |
          if [ -z "${{ secrets.SNYK_TOKEN }}" ]; then
            echo "SNYK_TOKEN not set, skipping Snyk scan"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        if: steps.check-token.outputs.skip != 'true'
        uses: actions/checkout@v6

      - name: Setup uv
        if: steps.check-token.outputs.skip != 'true'
        uses: astral-sh/setup-uv@02f6c237bd2518259fed6c71566509edfb3f2b74 # v4
        with:
          version: 'latest'

      - name: Set up Python
        if: steps.check-token.outputs.skip != 'true'
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        if: steps.check-token.outputs.skip != 'true'
        working-directory: apps/backend
        run: uv sync

      - name: Run Snyk to check Python dependencies
        if: steps.check-token.outputs.skip != 'true'
        uses: snyk/actions/python@9adf32b1121593767fc3c057af55b55db032dc04 # master 2026-03-24
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=apps/backend/pyproject.toml

      - name: Upload Snyk report
        if: steps.check-token.outputs.skip != 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-backend-report
          path: snyk-report.json
          retention-days: 30

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, LGPL-3.0

  npm-audit:
    name: NPM Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@6e7bdbda5fe05107efc88b23b7ed00aa05f84ca0 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run npm audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Generate audit report
        if: always()
        run: pnpm audit --json > npm-audit-report.json
        continue-on-error: true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          retention-days: 30

  trivy-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # master 2026-03-24
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: trivy-results.sarif
          retention-days: 30

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [npm-audit, trivy-scan]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Display security scan results
        run: |
          echo "# Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Required Scans Completed:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ NPM Audit (no token required)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Trivy Container Scan (no token required)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Optional Scans:" >> $GITHUB_STEP_SUMMARY
          echo "- ⚙️ Snyk Security Scans (requires SNYK_TOKEN secret)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All required security scans completed successfully." >> $GITHUB_STEP_SUMMARY
          echo "Please review the artifact reports for detailed findings." >> $GITHUB_STEP_SUMMARY
