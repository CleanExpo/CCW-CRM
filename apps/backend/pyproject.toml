[project]
name = "ccw-erp-backend"
version = "1.0.0"
description = "CCW Equipment Supplier ERP Backend API"
requires-python = ">=3.12"

dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Database (PostgreSQL + SQLAlchemy)
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0", # Async PostgreSQL driver
    "psycopg2-binary>=2.9.0", # Sync PostgreSQL driver (for migrations)
    "pgvector>=0.3.0", # Vector similarity search
    "alembic>=1.13.0", # Database migrations
    # Caching
    "redis>=5.0.0", # Redis async client for caching
    # Authentication
    "python-jose[cryptography]>=3.3.0", # JWT tokens
    "passlib[bcrypt]>=1.7.0", # Password hashing
    # Billing
    "stripe>=7.0.0", # Stripe payment processing
    # Core
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.0.0", # For pydantic email validation
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    "structlog>=24.4.0",
    "python-multipart>=0.0.12",
    "slowapi>=0.1.9", # Rate limiting
    "sendgrid>=6.11.0", # Email notifications
    "fastapi-mail>=1.4.1", # Email notifications for system alerts
    "prometheus-fastapi-instrumentator>=7.0.0", # Prometheus metrics
    "prometheus-client>=0.19.0", # Prometheus Python client
    "apscheduler>=3.10.0", # Job scheduling
    # AI/LLM (LangChain + Ollama + Anthropic)
    "langchain>=0.1.0",
    "langchain-community>=0.0.20",
    "langchain-core>=0.1.0",
    "langgraph>=0.0.20",
    "ollama>=0.1.6",
    "anthropic>=0.39.0", # Claude API for code generation
    "sse-starlette>=3.2.0",
    "sentry-sdk[fastapi]>=2.52.0",
    "logtail-python>=0.3.0",  # BetterStack log drain
    # Supabase client (state store, RAG storage, migrations)
    "supabase>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",  # HTTP mocking for tests
    "mypy>=1.13.0",
    "ruff>=0.7.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",  # For integration tests
    "faker>=28.0.0",  # Fake data for load tests
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "TID251"]
ignore = [
    "E501",   # Line too long — codebase predates this rule
    "E402",   # Module import not at top — intentional in some files
    "E712",   # Comparison to True/False — pre-existing style
    "E741",   # Ambiguous variable name — pre-existing
    "F821",   # Undefined name — false positives with optional imports
    "F841",   # Unused variable — pre-existing
    "N806",   # Non-lowercase variable in function — pre-existing
    "N811",   # Constant imported as non-constant — pre-existing
    "N812",   # Lowercase imported as non-lowercase — pre-existing
    "N815",   # Mixed-case variable in class scope — pre-existing
    "N818",   # Error suffix on exception name — pre-existing
    "W293",   # Blank line with whitespace — pre-existing
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.getenv".msg = "Use `from src.config.settings import get_settings` instead of reading env vars directly."
"os.environ.get".msg = "Use `from src.config.settings import get_settings` instead of reading env vars directly."

[tool.ruff.lint.per-file-ignores]
"src/config/*.py" = ["TID251"]
"src/integrations/secrets_manager.py" = ["TID251"]
"src/api/routes/billing.py" = ["TID251"]

[tool.vulture]
min_confidence = 90
paths = ["src", "vulture_whitelist.py"]
ignore_names = [
    # Function parameters that are part of public API contracts (cannot be removed)
    "diff",             # risk_assessor.py assess_change_risk()
    "commit_message",   # risk_assessor.py assess_change_risk()
    "customer_location", # inventory_intelligence.py execute()
    "execution_options", # tenant_isolation.py before_execute() — SQLAlchemy event signature
    "multiparams",      # tenant_isolation.py before_execute() — SQLAlchemy event signature
    "notify_data",      # backorders.py notify_customer() — FastAPI request body
    "cvv",              # amex.py tokenize_card()
    "expiry",           # amex.py tokenize_card()
    "author",           # pr_automation.py commit_changes()
    # demo_models.py re-exports — locked file, cannot be modified
    "i18n_models",
    "inventory_models",
]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "src.api.routes.demo_lists"
ignore_errors = true

[[tool.mypy.overrides]]
module = "src.api.routes.demo_dashboard"
ignore_errors = true

[[tool.mypy.overrides]]
module = "src.api.routes.demo_auth"
ignore_errors = true

[[tool.mypy.overrides]]
module = "src.db.demo_models"
ignore_errors = true

[[tool.mypy.overrides]]
module = "src.db.seed_demo"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "asyncio: mark test as async",
    "integration: mark test as integration test",
    "unit: mark test as unit test",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/.venv/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "vulture>=2.16",
]
