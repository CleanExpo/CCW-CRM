# Docker Compose Configuration for Staging Environment
# CCW-Online ERP - Staging Deployment
#
# Features:
# - PostgreSQL database (persistent volume)
# - Redis cache (persistent volume)
# - Backend API (FastAPI)
# - Frontend web (Next.js)
# - Nginx reverse proxy (SSL termination)
# - Resource limits (staging specs)
# - Health checks
# - Restart policies
#
# Usage:
#   docker compose -f docker-compose.staging.yml up -d
#   docker compose -f docker-compose.staging.yml logs -f
#   docker compose -f docker-compose.staging.yml down

version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ccw-erp-postgres-staging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-starter_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-starter_password}
      POSTGRES_DB: ${POSTGRES_DB:-starter_db_staging}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - '5432:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-starter_user} -d ${POSTGRES_DB:-starter_db_staging}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ccw-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ccw-erp-redis-staging
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-redis_staging_password}
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - ccw-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Backend API (FastAPI)
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: '3.12'
    container_name: ccw-erp-backend-staging
    restart: unless-stopped
    environment:
      # Environment
      ENVIRONMENT: staging
      DEBUG: 'false'
      LOG_LEVEL: INFO

      # Database
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-starter_user}:${POSTGRES_PASSWORD:-starter_password}@postgres:5432/${POSTGRES_DB:-starter_db_staging}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_staging_password}
      REDIS_DB: 0
      CACHE_ENABLED: 'true'

      # JWT
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 60

      # CORS
      CORS_ORIGINS: '["https://staging.ccw-erp.com"]'

      # Stripe
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}

      # SendGrid
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}

      # Sentry
      SENTRY_DSN: ${SENTRY_DSN}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-ccw-erp@1.0.0}
      SENTRY_TRACES_SAMPLE_RATE: 0.1

      # Monitoring
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '8000:8000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ccw-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Frontend Web (Next.js)
  # Context is monorepo root so pnpm-lock.yaml + workspace files are available
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NODE_VERSION: '20'
        NEXT_PUBLIC_BACKEND_URL: https://api.staging.ccw-erp.com
    container_name: ccw-erp-web-staging
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BACKEND_URL: https://api.staging.ccw-erp.com
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ccw-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # Nginx Reverse Proxy
  nginx:
    image: nginx:1.24-alpine
    container_name: ccw-erp-nginx-staging
    restart: unless-stopped
    volumes:
      - ./deployment/nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - backend
      - web
    healthcheck:
      test: ['CMD', 'nginx', '-t']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ccw-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 64M

networks:
  ccw-network:
    name: ccw-staging-network
    driver: bridge

volumes:
  postgres_data:
    name: ccw-postgres-staging-data
    driver: local
  redis_data:
    name: ccw-redis-staging-data
    driver: local
  nginx_logs:
    name: ccw-nginx-staging-logs
    driver: local
