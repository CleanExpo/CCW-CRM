services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: nodejs-starter-postgres
    environment:
      POSTGRES_DB: starter_db
      POSTGRES_USER: starter_user
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_HOST_AUTH_METHOD: trust  # Simplified for local development
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starter_user -d starter_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - starter-network

  redis:
    image: redis:7-alpine
    container_name: nodejs-starter-redis
    ports:
      - "6381:6379"  # Mapped to 6381 to avoid conflict with other Redis instances
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - starter-network

  # Backend service (running in Docker)
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: nodejs-starter-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://starter_user:local_dev_password@postgres:5432/starter_db
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      ENVIRONMENT: development
      DEBUG: "True"
      LOG_LEVEL: DEBUG
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:3005","http://localhost:3006","http://localhost:3007","http://localhost:3011","http://localhost:8080","http://10.252.22.111:3006","http://10.252.22.111:3007","http://192.168.2.65:3011"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - starter-network
    volumes:
      - ./apps/backend/src:/app/src
      - ./apps/backend/alembic:/app/alembic
      - ./apps/backend/alembic.ini:/app/alembic.ini
    command: uv run uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: ccw-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - starter-network

  grafana:
    image: grafana/grafana:10.2.2
    container_name: ccw-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - starter-network

  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: ccw-alertmanager
    restart: unless-stopped
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
    environment:
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    ports:
      - "9093:9093"
    networks:
      - starter-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: ccw-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://starter_user:local_dev_password@postgres:5432/starter_db?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - starter-network

  redis-exporter:
    image: oliver006/redis_exporter:v1.55.0
    container_name: ccw-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis:6379"
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - starter-network

volumes:
  postgres_data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  starter-network:
    driver: bridge
