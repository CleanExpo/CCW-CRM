---
# Celery Worker Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: ccw-erp
  labels:
    app: ccw-online-erp
    component: celery-worker
spec:
  replicas: 2  # Will be managed by HPA
  selector:
    matchLabels:
      app: ccw-online-erp
      component: celery-worker
  template:
    metadata:
      labels:
        app: ccw-online-erp
        component: celery-worker
    spec:
      containers:
        - name: celery-worker
          image: ccw-erp-backend:latest
          imagePullPolicy: Always
          command:
            - celery
            - -A
            - src.core.celery_app
            - worker
            - --loglevel=info
            - --concurrency=4
            - --max-tasks-per-child=1000
          env:
            # Database Configuration
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: ccw-erp-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: ccw-erp-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: ccw-erp-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: ccw-erp-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ccw-erp-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"

            # Redis Configuration
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: ccw-erp-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: ccw-erp-config
                  key: REDIS_PORT
            - name: REDIS_URL
              value: "redis://$(REDIS_HOST):$(REDIS_PORT)"

            # Celery Configuration
            - name: CELERY_BROKER_URL
              valueFrom:
                configMapKeyRef:
                  name: ccw-erp-config
                  key: CELERY_BROKER_URL
            - name: CELERY_RESULT_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: ccw-erp-config
                  key: CELERY_RESULT_BACKEND

            # Application Settings
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: ccw-erp-config
                  key: ENVIRONMENT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: ccw-erp-config
                  key: LOG_LEVEL

            # AI Provider (from secrets)
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ccw-erp-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true

          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 1Gi

          # Health check via Celery inspect
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - src.core.celery_app
                - inspect
                - ping
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

---
# Celery Beat Deployment (Scheduler)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: ccw-erp
  labels:
    app: ccw-online-erp
    component: celery-beat
spec:
  replicas: 1  # Only one beat scheduler
  selector:
    matchLabels:
      app: ccw-online-erp
      component: celery-beat
  template:
    metadata:
      labels:
        app: ccw-online-erp
        component: celery-beat
    spec:
      containers:
        - name: celery-beat
          image: ccw-erp-backend:latest
          imagePullPolicy: Always
          command:
            - celery
            - -A
            - src.core.celery_app
            - beat
            - --loglevel=info
          env:
            # Database Configuration
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: ccw-erp-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: ccw-erp-config
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: ccw-erp-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: ccw-erp-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ccw-erp-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"

            # Redis Configuration
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: ccw-erp-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: ccw-erp-config
                  key: REDIS_PORT
            - name: REDIS_URL
              value: "redis://$(REDIS_HOST):$(REDIS_PORT)"

            # Celery Configuration
            - name: CELERY_BROKER_URL
              valueFrom:
                configMapKeyRef:
                  name: ccw-erp-config
                  key: CELERY_BROKER_URL
            - name: CELERY_RESULT_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: ccw-erp-config
                  key: CELERY_RESULT_BACKEND

            # Application Settings
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: ccw-erp-config
                  key: ENVIRONMENT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: ccw-erp-config
                  key: LOG_LEVEL

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
