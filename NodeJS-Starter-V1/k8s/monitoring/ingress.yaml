---
# Monitoring Ingress (Prometheus + Grafana)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring-ingress
  namespace: monitoring
  labels:
    app: monitoring
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: monitoring-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: 'Authentication Required'
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - prometheus.your-domain.com
        - grafana.your-domain.com
      secretName: monitoring-tls-cert
  rules:
    # Prometheus UI
    - host: prometheus.your-domain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  name: http

    # Grafana UI
    - host: grafana.your-domain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  name: http

---
# Basic Auth Secret for Prometheus (optional - Grafana has its own auth)
# Generate with: htpasswd -c auth admin
# Then: kubectl create secret generic monitoring-basic-auth --from-file=auth -n monitoring
apiVersion: v1
kind: Secret
metadata:
  name: monitoring-basic-auth
  namespace: monitoring
type: Opaque
stringData:
  # Username: admin, Password: admin
  # Generate your own with: echo $(htpasswd -nb admin yourpassword) | base64
  auth: |
    admin:$apr1$ruca84Hq$mbjdMZBAG.KWn7vfN/SNK/
