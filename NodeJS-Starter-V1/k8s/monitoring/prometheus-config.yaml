---
# Prometheus ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      evaluation_interval: 15s
      external_labels:
        cluster: ccw-erp-production
        environment: production

    # Alertmanager configuration (optional)
    # alerting:
    #   alertmanagers:
    #     - static_configs:
    #         - targets:
    #           - alertmanager:9093

    # Load alerting rules
    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      # Prometheus self-monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Kubernetes API Server
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

      # Kubernetes nodes
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      # Kubernetes pods (with prometheus.io/scrape annotation)
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # Only scrape pods with prometheus.io/scrape annotation
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true

          # Get scrape port from annotation or default to 80
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2

          # Get scrape path from annotation or default to /metrics
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)

          # Add namespace, pod name, and container as labels
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
          - source_labels: [__meta_kubernetes_pod_container_name]
            action: replace
            target_label: kubernetes_container_name

      # CCW-ERP Backend API
      - job_name: 'ccw-erp-backend'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ccw-erp
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: backend-service
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service

      # CCW-ERP Frontend
      - job_name: 'ccw-erp-frontend'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ccw-erp
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: frontend-service
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            action: keep
            regex: http
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service

      # PostgreSQL (if postgres_exporter is deployed)
      - job_name: 'postgresql'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ccw-erp
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: postgres-exporter
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

      # Redis (if redis_exporter is deployed)
      - job_name: 'redis'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - ccw-erp
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: redis-exporter
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

  # Alert rules
  alerts.yml: |
    groups:
      - name: application_alerts
        interval: 30s
        rules:
          # High Error Rate
          - alert: HighErrorRate
            expr: |
              (
                rate(http_requests_total{status=~"5.."}[5m]) /
                rate(http_requests_total[5m])
              ) > 0.05
            for: 5m
            labels:
              severity: warning
              component: backend
            annotations:
              summary: "High error rate detected"
              description: "Error rate is {{ $value | humanizePercentage }} for {{ $labels.service }}"

          # High Response Time
          - alert: HighResponseTime
            expr: |
              histogram_quantile(0.95,
                rate(http_request_duration_seconds_bucket[5m])
              ) > 1
            for: 5m
            labels:
              severity: warning
              component: backend
            annotations:
              summary: "High response time detected"
              description: "95th percentile response time is {{ $value }}s for {{ $labels.service }}"

          # Service Down
          - alert: ServiceDown
            expr: up{job=~"ccw-erp-.*"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Service is down"
              description: "{{ $labels.service }} has been down for more than 2 minutes"

          # Database Connection Issues
          - alert: DatabaseConnectionPoolExhausted
            expr: |
              db_pool_connections_used / db_pool_connections_total > 0.9
            for: 5m
            labels:
              severity: warning
              component: database
            annotations:
              summary: "Database connection pool nearly exhausted"
              description: "Connection pool usage is at {{ $value | humanizePercentage }}"

          # Celery Queue Backlog
          - alert: CeleryQueueBacklog
            expr: celery_queue_length > 1000
            for: 10m
            labels:
              severity: warning
              component: celery
            annotations:
              summary: "Large Celery queue backlog"
              description: "Queue has {{ $value }} pending tasks"

          # WebSocket Connection Surge
          - alert: WebSocketConnectionSurge
            expr: |
              rate(websocket_connections_total[5m]) > 100
            for: 5m
            labels:
              severity: info
              component: websocket
            annotations:
              summary: "Unusual WebSocket connection rate"
              description: "Connection rate is {{ $value }} connections/sec"

      - name: infrastructure_alerts
        interval: 30s
        rules:
          # High CPU Usage
          - alert: HighCPUUsage
            expr: |
              100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage detected"
              description: "CPU usage is {{ $value }}% on {{ $labels.instance }}"

          # High Memory Usage
          - alert: HighMemoryUsage
            expr: |
              (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage detected"
              description: "Memory usage is {{ $value }}% on {{ $labels.instance }}"

          # Pod Restart Loop
          - alert: PodRestartLoop
            expr: |
              rate(kube_pod_container_status_restarts_total[15m]) > 0
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Pod is restarting frequently"
              description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in the last 15 minutes"

          # HPA at Max Replicas
          - alert: HPAMaxedOut
            expr: |
              kube_horizontalpodautoscaler_status_current_replicas
              ==
              kube_horizontalpodautoscaler_spec_max_replicas
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "HPA has reached maximum replicas"
              description: "HPA {{ $labels.horizontalpodautoscaler }} is at max capacity"
