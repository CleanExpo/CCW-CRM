---
# Grafana Dashboards ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    app: grafana
data:
  # Application Performance Dashboard
  app-performance.json: |
    {
      "dashboard": {
        "title": "CCW-ERP Application Performance",
        "tags": ["ccw-erp", "performance"],
        "timezone": "browser",
        "schemaVersion": 16,
        "version": 0,
        "refresh": "10s",
        "panels": [
          {
            "id": 1,
            "title": "Request Rate (req/s)",
            "type": "graph",
            "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "rate(http_requests_total{namespace=\"ccw-erp\"}[5m])",
                "legendFormat": "{{service}} - {{method}} {{path}}"
              }
            ]
          },
          {
            "id": 2,
            "title": "Request Latency (p95)",
            "type": "graph",
            "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{namespace=\"ccw-erp\"}[5m]))",
                "legendFormat": "{{service}}"
              }
            ]
          },
          {
            "id": 3,
            "title": "Error Rate (%)",
            "type": "graph",
            "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "(rate(http_requests_total{namespace=\"ccw-erp\",status=~\"5..\"}[5m]) / rate(http_requests_total{namespace=\"ccw-erp\"}[5m])) * 100",
                "legendFormat": "{{service}}"
              }
            ]
          },
          {
            "id": 4,
            "title": "Active Pods",
            "type": "stat",
            "gridPos": {"x": 12, "y": 8, "w": 6, "h": 4},
            "targets": [
              {
                "expr": "count(up{namespace=\"ccw-erp\"} == 1)",
                "legendFormat": "Active Pods"
              }
            ]
          },
          {
            "id": 5,
            "title": "WebSocket Connections",
            "type": "graph",
            "gridPos": {"x": 0, "y": 16, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "websocket_connections_active{namespace=\"ccw-erp\"}",
                "legendFormat": "Active Connections"
              }
            ]
          },
          {
            "id": 6,
            "title": "Celery Queue Length",
            "type": "graph",
            "gridPos": {"x": 12, "y": 16, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "celery_queue_length{namespace=\"ccw-erp\"}",
                "legendFormat": "{{queue}}"
              }
            ]
          }
        ]
      }
    }

  # Infrastructure Health Dashboard
  infrastructure.json: |
    {
      "dashboard": {
        "title": "CCW-ERP Infrastructure Health",
        "tags": ["ccw-erp", "infrastructure"],
        "timezone": "browser",
        "schemaVersion": 16,
        "version": 0,
        "refresh": "30s",
        "panels": [
          {
            "id": 1,
            "title": "CPU Usage by Pod",
            "type": "graph",
            "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "rate(container_cpu_usage_seconds_total{namespace=\"ccw-erp\"}[5m]) * 100",
                "legendFormat": "{{pod}}"
              }
            ]
          },
          {
            "id": 2,
            "title": "Memory Usage by Pod",
            "type": "graph",
            "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "container_memory_working_set_bytes{namespace=\"ccw-erp\"} / 1024 / 1024",
                "legendFormat": "{{pod}}"
              }
            ]
          },
          {
            "id": 3,
            "title": "Pod Restart Count",
            "type": "graph",
            "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "kube_pod_container_status_restarts_total{namespace=\"ccw-erp\"}",
                "legendFormat": "{{pod}}"
              }
            ]
          },
          {
            "id": 4,
            "title": "HPA Status",
            "type": "table",
            "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"ccw-erp\"}",
                "format": "table",
                "instant": true
              }
            ]
          },
          {
            "id": 5,
            "title": "Network I/O",
            "type": "graph",
            "gridPos": {"x": 0, "y": 16, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "rate(container_network_receive_bytes_total{namespace=\"ccw-erp\"}[5m])",
                "legendFormat": "{{pod}} - RX"
              },
              {
                "expr": "rate(container_network_transmit_bytes_total{namespace=\"ccw-erp\"}[5m])",
                "legendFormat": "{{pod}} - TX"
              }
            ]
          },
          {
            "id": 6,
            "title": "Disk I/O",
            "type": "graph",
            "gridPos": {"x": 12, "y": 16, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "rate(container_fs_reads_bytes_total{namespace=\"ccw-erp\"}[5m])",
                "legendFormat": "{{pod}} - Read"
              },
              {
                "expr": "rate(container_fs_writes_bytes_total{namespace=\"ccw-erp\"}[5m])",
                "legendFormat": "{{pod}} - Write"
              }
            ]
          }
        ]
      }
    }

  # Business Metrics Dashboard
  business-metrics.json: |
    {
      "dashboard": {
        "title": "CCW-ERP Business Metrics",
        "tags": ["ccw-erp", "business"],
        "timezone": "browser",
        "schemaVersion": 16,
        "version": 0,
        "refresh": "1m",
        "panels": [
          {
            "id": 1,
            "title": "Orders Per Hour",
            "type": "graph",
            "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "rate(business_orders_created_total[1h]) * 3600",
                "legendFormat": "Orders/hour"
              }
            ]
          },
          {
            "id": 2,
            "title": "Revenue Per Day",
            "type": "graph",
            "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "rate(business_revenue_total[1d]) * 86400",
                "legendFormat": "Revenue/day"
              }
            ]
          },
          {
            "id": 3,
            "title": "Inventory Turnover",
            "type": "graph",
            "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "business_inventory_movements_total",
                "legendFormat": "{{movement_type}}"
              }
            ]
          },
          {
            "id": 4,
            "title": "Customer Satisfaction Score",
            "type": "gauge",
            "gridPos": {"x": 12, "y": 8, "w": 6, "h": 8},
            "targets": [
              {
                "expr": "business_customer_satisfaction_score",
                "legendFormat": "CSAT"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "min": 0,
                "max": 5,
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"value": 0, "color": "red"},
                    {"value": 3, "color": "yellow"},
                    {"value": 4, "color": "green"}
                  ]
                }
              }
            }
          },
          {
            "id": 5,
            "title": "Backorder Fill Rate",
            "type": "graph",
            "gridPos": {"x": 0, "y": 16, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "(business_backorders_fulfilled_total / business_backorders_created_total) * 100",
                "legendFormat": "Fill Rate %"
              }
            ]
          },
          {
            "id": 6,
            "title": "Quote Conversion Rate",
            "type": "graph",
            "gridPos": {"x": 12, "y": 16, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "(business_quotes_converted_total / business_quotes_created_total) * 100",
                "legendFormat": "Conversion Rate %"
              }
            ]
          }
        ]
      }
    }

  # AI Agent Performance Dashboard
  agent-performance.json: |
    {
      "dashboard": {
        "title": "CCW-ERP AI Agent Performance",
        "tags": ["ccw-erp", "ai-agents"],
        "timezone": "browser",
        "schemaVersion": 16,
        "version": 0,
        "refresh": "30s",
        "panels": [
          {
            "id": 1,
            "title": "Agent Decisions Per Minute",
            "type": "graph",
            "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "rate(agent_decisions_total[5m]) * 60",
                "legendFormat": "{{agent_name}}"
              }
            ]
          },
          {
            "id": 2,
            "title": "Agent Decision Latency (p95)",
            "type": "graph",
            "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(agent_decision_duration_seconds_bucket[5m]))",
                "legendFormat": "{{agent_name}}"
              }
            ]
          },
          {
            "id": 3,
            "title": "Auto-Execution Rate",
            "type": "graph",
            "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "(rate(agent_decisions_auto_executed_total[5m]) / rate(agent_decisions_total[5m])) * 100",
                "legendFormat": "{{agent_name}}"
              }
            ]
          },
          {
            "id": 4,
            "title": "Human Override Rate",
            "type": "graph",
            "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "(rate(agent_decisions_overridden_total[5m]) / rate(agent_decisions_total[5m])) * 100",
                "legendFormat": "{{agent_name}}"
              }
            ]
          },
          {
            "id": 5,
            "title": "Agent Confidence Scores",
            "type": "graph",
            "gridPos": {"x": 0, "y": 16, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "avg(agent_decision_confidence) by (agent_name)",
                "legendFormat": "{{agent_name}}"
              }
            ]
          },
          {
            "id": 6,
            "title": "Agent Success Rate",
            "type": "graph",
            "gridPos": {"x": 12, "y": 16, "w": 12, "h": 8},
            "targets": [
              {
                "expr": "(rate(agent_decisions_successful_total[5m]) / rate(agent_decisions_total[5m])) * 100",
                "legendFormat": "{{agent_name}}"
              }
            ]
          }
        ]
      }
    }
