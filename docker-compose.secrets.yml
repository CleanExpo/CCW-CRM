# Docker Compose Configuration with Secrets Support
# CCW-Online ERP - Production/Staging Deployment with Docker Secrets
#
# This configuration uses Docker secrets for sensitive credentials.
# For development, use docker-compose.yml instead.
#
# Usage:
#   # Create secret files first (see secrets/README.md)
#   docker compose -f docker-compose.secrets.yml up -d
#
# Prerequisites:
#   - Create secrets/ directory with secret files
#   - Or use external secrets from Docker Swarm / Kubernetes

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: ccw-erp-postgres
    restart: unless-stopped
    secrets:
      - postgres_password
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ccw_erp_db}
      POSTGRES_USER: ${POSTGRES_USER:-ccw_erp_user}
      # Use Docker secret file for password
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # Force SCRAM-SHA-256 authentication (no trust)
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ccw_erp_user} -d ${POSTGRES_DB:-ccw_erp_db}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ccw-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  redis:
    image: redis:7-alpine
    container_name: ccw-erp-redis
    restart: unless-stopped
    secrets:
      - redis_password
    # Redis with password authentication using secret file
    command: >
      sh -c "
        REDIS_PASS=$$(cat /run/secrets/redis_password) &&
        redis-server
        --appendonly yes
        --appendfsync everysec
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --requirepass $$REDIS_PASS
      "
    volumes:
      - redis_data:/data
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - ccw-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: '3.12'
    container_name: ccw-erp-backend
    restart: unless-stopped
    secrets:
      - postgres_password
      - redis_password
      - jwt_secret
      - encryption_key
    environment:
      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # Database - password loaded from secret file
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-ccw_erp_db}
      DATABASE_USER: ${POSTGRES_USER:-ccw_erp_user}
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password

      # Redis - password loaded from secret file
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
      CACHE_ENABLED: 'true'

      # JWT - secret loaded from secret file
      JWT_SECRET_KEY_FILE: /run/secrets/jwt_secret
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}

      # Encryption - key loaded from secret file
      ENCRYPTION_KEY_FILE: /run/secrets/encryption_key

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-["https://staging.ccw-erp.com"]}

      # Optional integrations (from environment)
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-ccw-erp@1.0.0}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '${BACKEND_PORT:-8000}:8000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ccw-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Monitoring services (same as main docker-compose)
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: ccw-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    networks:
      - ccw-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  grafana:
    image: grafana/grafana:10.2.2
    container_name: ccw-grafana
    restart: unless-stopped
    secrets:
      - grafana_admin_password
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_URL:-http://localhost:3001}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '${GRAFANA_PORT:-3001}:3000'
    depends_on:
      - prometheus
    networks:
      - ccw-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: ccw-postgres-exporter
    restart: unless-stopped
    secrets:
      - postgres_password
    environment:
      # Build DATA_SOURCE_NAME from secret file
      DATA_SOURCE_NAME_FILE: /run/secrets/postgres_exporter_dsn
    # Alternative: use entrypoint to construct DSN
    entrypoint: >
      sh -c "
        PG_PASS=$$(cat /run/secrets/postgres_password) &&
        export DATA_SOURCE_NAME=\"postgresql://${POSTGRES_USER:-ccw_erp_user}:$$PG_PASS@postgres:5432/${POSTGRES_DB:-ccw_erp_db}?sslmode=disable\" &&
        /postgres_exporter
      "
    ports:
      - '${POSTGRES_EXPORTER_PORT:-9187}:9187'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ccw-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  redis-exporter:
    image: oliver006/redis_exporter:v1.55.0
    container_name: ccw-redis-exporter
    restart: unless-stopped
    secrets:
      - redis_password
    entrypoint: >
      sh -c "
        REDIS_PASS=$$(cat /run/secrets/redis_password) &&
        /redis_exporter --redis.addr=redis://redis:6379 --redis.password=$$REDIS_PASS
      "
    ports:
      - '${REDIS_EXPORTER_PORT:-9121}:9121'
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ccw-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

# Docker Secrets - loaded from files
secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  encryption_key:
    file: ./secrets/encryption_key.txt
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt

volumes:
  postgres_data:
    name: ccw-postgres-data
    driver: local
  redis_data:
    name: ccw-redis-data
    driver: local
  prometheus-data:
    name: ccw-prometheus-data
    driver: local
  grafana-data:
    name: ccw-grafana-data
    driver: local

networks:
  ccw-network:
    name: ccw-erp-network
    driver: bridge
