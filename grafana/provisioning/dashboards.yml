apiVersion: 1

providers:
  - name: 'Autonomous Development Dashboards'
    orgId: 1
    folder: 'Phase 5 - Autonomous Development'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
