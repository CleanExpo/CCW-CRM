# Prometheus Configuration for CCW-Online ERP
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'ccw-erp-production'
    environment: 'production'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

rule_files:
  - 'alert-rules-prod.yml'

scrape_configs:
  - job_name: 'ccw-erp-backend'
    metrics_path: '/api/metrics'
    static_configs:
      - targets:
          - 'backend:8000'

  - job_name: 'postgresql'
    static_configs:
      - targets:
          - 'postgres-exporter:9187'

  - job_name: 'redis'
    static_configs:
      - targets:
          - 'redis-exporter:9121'

  - job_name: 'node'
    static_configs:
      - targets:
          - 'node-exporter:9100'

  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'localhost:9090'
