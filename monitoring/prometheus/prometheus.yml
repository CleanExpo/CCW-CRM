global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'ccw-erp'
    environment: 'development'

# Load alert rules
rule_files:
  - 'alert_rules.yml'

# AlertManager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Scrape configurations
scrape_configs:
  # Backend API metrics (assuming backend runs on host)
  - job_name: 'ccw-backend'
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # PostgreSQL metrics (using postgres_exporter - optional)
  # Uncomment when postgres_exporter is added
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # Redis metrics (using redis_exporter - optional)
  # Uncomment when redis_exporter is added
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
